[package]
name = "yobu"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
freedesktop-desktop-entry = { version = "0.8.1", default-features = false }
numby = { version = "0.1.8", default-features = false }
neo_frizbee = "0.11"

[dev-dependencies]
criterion = "0.8"

[[bin]]
name = "yobu"
path = "src/bin/yobu.rs"

[[bin]]
name = "yobud"
path = "src/bin/yobud.rs"

[[bench]]
name = "performance"
harness = false
