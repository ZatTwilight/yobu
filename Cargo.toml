[workspace]
members = ["crates/yobu-cli", "crates/yobu-daemon", "crates/yobu-protocol"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
yobu-protocol = { path = "crates/yobu-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
freedesktop-desktop-entry = { version = "0.8.1", default-features = false }
numby = { version = "0.1.8", default-features = false }
neo_frizbee = "0.11"
