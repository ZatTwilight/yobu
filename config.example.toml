# Copy to ~/.config/yobu/config.toml
width = 600
height = 420
max_results = 50

# Independent systemd user services: auto prefers an active UWSM session,
# otherwise systemd-run. Explicit choices: "uwsm" or "systemd".
# No direct-spawn fallback. Terminal desktop entries require UWSM.
#[launch]
#backend = "auto"

# Optional — defaults shown. Only account usage limits and reset times are collected.
# Codex uses its official app-server; OpenCode Go uses its usage API.
# Session histories and token counts are never read.
#[ai]
#poll_secs = 300
